jenkins:
  systemMessage: "DevSecOps Jenkins — SonarQube · OWASP · Prometheus"
  numExecutors: 4
  mode: NORMAL
  scmCheckoutRetryCount: 2

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              id: sonar-token
              description: "SonarQube analysis token"
              secret: "${SONAR_TOKEN:-changeme}"

tool:
  sonarRunnerInstallation:
    installations:
      - name: SonarScanner
        properties:
          - installSource:
              installers:
                - sonarRunnerInstaller:
                    id: "5.0.1.3006"

  dependency-check:
    installations:
      - name: owasp-dc
        properties:
          - installSource:
              installers:
                - dependencyCheckInstaller:
                    id: "9.2.0"

unclassified:
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: SonarQube
        serverUrl: "http://sonarqube:9000"
        credentialsId: sonar-token

  prometheusConfiguration:
    collectDiskUsage: true
    countAbortedBuilds: true
    countFailedBuilds: true
    countNotBuiltBuilds: false
    countSuccessfulBuilds: true
    countUnstableBuilds: true
    jobAttributeName: jenkins_data
    path: prometheus
    useAuthenticatedEndpoint: false
