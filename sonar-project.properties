# ── SonarQube Project Configuration ──────────────────────────
sonar.projectKey=my-project
sonar.projectName=My DevSecOps Project
sonar.projectVersion=1.0

# Source & encoding
sonar.sources=src/main
sonar.tests=src/test
sonar.java.source=17
sonar.sourceEncoding=UTF-8

# Coverage reports
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.junit.reportPaths=target/surefire-reports

# OWASP / Security rules
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=java:S2629
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*Test.java

# Quality Gate thresholds (configure in UI or via API)
# Coverage      ≥ 80%
# Duplications  ≤  3%
# Maintainability rating  ≥ A
# Reliability rating      ≥ A
# Security rating         ≥ A
